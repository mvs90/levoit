name: UART sanitizer verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uart-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run UART regressions with ASan and UBSan
        run: |
          git diff --quiet 7ed0656a83b81f02a7d137b4c5685779fd917384 -- components/levoit
          clang++ --version
          LEVOIT_TEST_SANITIZERS=address,undefined python components/levoit/tests/test_uart_integrity.py
